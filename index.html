<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Star — Claim Your Free Bonus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand">
                <img src="logo/Screenshot-2026-06-08-110811-removebg-preview (1).png" alt="Lucky Star" class="brand-logo">
            </a>

            <nav class="header-nav">
                <a href="#bonus" class="nav-link active">Bonus</a>
                <a href="login/index.html" class="nav-link">Support</a>
            </nav>

            <div class="header-right">
                <span class="trust-badge">
                    <svg viewBox="0 0 24 24" class="icon icon-green" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                    Verified
                </span>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="page">

        <!-- BANNER -->
        <section class="banner-wrap">
            <img src="banner/photo_2026-09-30_08-18-05.jpg" alt="Congratulations — Claim your free bonus" class="banner-img">
        </section>

        <!-- CLAIM CARD -->
        <section class="claim-card">
            <div class="claim-left">
                <h1 class="claim-title">Claim Your Bonus</h1>
                <p class="claim-sub">Aapka free bonus ready hai. Form bhar ke claim karo.</p>
            </div>

            <div class="claim-actions">
                <a href="login/index.html" class="btn-primary" id="claim-bonus-btn">
                    <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 12v10H4V12"/>
                        <path d="M2 7h20v5H2z"/>
                        <path d="M12 22V7"/>
                        <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
                        <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
                    </svg>
                    <span>Claim Now</span>
                </a>

                <a href="bonus-status/index.html" class="btn-secondary" id="bonus-status-btn">
                    <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3 2"/>
                    </svg>
                    <span>Bonus Status</span>
                </a>
            </div>
        </section>

        <!-- INFO STRIP -->
        <section class="info-grid" id="bonus">
            <div class="card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" class="icon icon-blue" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3 2"/>
                    </svg>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Fast Claim</h3>
                    <p class="card-text">Form bharte hi process ho jati hai.</p>
                </div>
            </div>

            <div class="card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" class="icon icon-green" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Secure</h3>
                    <p class="card-text">Details securely handle hoti hain.</p>
                </div>
            </div>

            <div class="card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" class="icon icon-blue" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </div>
                <div class="card-body">
                    <h3 class="card-title">Support 24/7</h3>
                    <p class="card-text">Hum har waqt available hain.</p>
                </div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
